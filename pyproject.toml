[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpyc-oracle"
version = "0.2.16"
description = "DPYC Social Contract community concierge — free MCP service for membership, governance, and onboarding"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Lonnie VanZandt" },
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "nostr-sdk>=0.45.0,<0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dpyc_oracle"]

[tool.ruff]
line-length = 100
target-version = "py310"

# An explicit rule set, matching excalibur-mcp and thebrain-mcp. This repo had no
# ruff configuration at all and so inherited whatever ruff's defaults happened to be
# — which is why CI went red on 2026-07-26 without a commit: 0.16 enabled new rules
# by default and the workflow installs ruff unpinned. Declaring the set is what makes
# a repo immune to that, and it is what the already-stable repos in the fleet do.
#
# BLE001 (blind-except) is deliberately outside this set rather than silenced by name.
# The Oracle's job is to read a remote registry and answer; a broad catch that returns
# a situation instead of raising is the intended shape here, not an oversight.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
